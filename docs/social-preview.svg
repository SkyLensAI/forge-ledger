<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Forge — a local-first ledger that CI keeps from rotting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#f0883e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2733" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <text x="72" y="96" fill="#f0f6fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="6">FORGE</text>
  <text x="76" y="130" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="3">FORGE LEDGER FORMAT · v1</text>

  <text x="72" y="252" fill="#f0f6fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700">Your AI memory rots.</text>
  <text x="72" y="330" fill="#f0883e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700">CI can stop it.</text>

  <text x="74" y="394" fill="#c9d1d9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">A local-first ledger where every claim keeps its source —</text>
  <text x="74" y="428" fill="#c9d1d9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">typed assets, hard provenance, and stale knowledge that fails the build.</text>

  <rect x="72" y="468" width="1136" height="112" rx="12" fill="#0d141c" stroke="#2a3644" stroke-width="1.5"/>
  <circle cx="98" cy="492" r="6" fill="#f0883e"/>
  <circle cx="120" cy="492" r="6" fill="#30363d"/>
  <circle cx="142" cy="492" r="6" fill="#30363d"/>
  <text x="100" y="526" fill="#79c0ff" font-family="Consolas, Menlo, monospace" font-size="17">$ forge lint --repo</text>
  <text x="100" y="552" fill="#7ee787" font-family="Consolas, Menlo, monospace" font-size="17">OK 45 assets · every span resolved</text>
  <text x="640" y="526" fill="#f0883e" font-family="Consolas, Menlo, monospace" font-size="17">$ forge context "why SQLite?"</text>
  <text x="640" y="552" fill="#c9d1d9" font-family="Consolas, Menlo, monospace" font-size="17">→ 226 / 1200 tokens, with a source</text>

  <text x="72" y="618" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">github.com/SkyLensAI/forge-ledger</text>
  <text x="1208" y="618" text-anchor="end" fill="#6e7681" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">no account · no cloud · byte-for-byte reproducible</text>
</svg>
