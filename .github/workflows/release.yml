name: release

# 闸门 5 的载体：发布只能从 CI 发出。
# environment: release 是发布门的"人"那一半 —— 在仓库设置里给它配
# required reviewers，发布就会卡在人工审批上（scripts/gates/setup-branch-protection.sh 会尽量代配）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release-gate
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    env:
      # 发布凭据只在 release environment 里可见；preflight 会明确要求它存在。
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 与 ci.yml 同一个下限（ADR-0011）：发布环境跑得动，本地才敢说"CI 会绿"。
          node-version: 24
          cache: pnpm
          # npm provenance 与 NODE_AUTH_TOKEN 需要 registry 配置。
          registry-url: https://registry.npmjs.org

      - name: install
        run: pnpm install --frozen-lockfile

      # 发布前把闸门 3 完整重跑一遍：tag 上的代码必须和 main 上一样绿。
      - name: gates
        run: pnpm gate:ci

      - name: release gate
        run: pnpm gate:release

      # 发布前的结构检查：版本、private、依赖链、files/engines/publishConfig。
      # 它不发布，只回答"现在这批 package.json 能不能被发出去"。
      - name: release preflight
        run: node scripts/gates/release-preflight.mjs

      # private 包会被 pnpm 跳过。把哪些包改成可发布是人的决定，
      # 但一旦改了，preflight 会保证依赖链完整。
      - name: publish
        run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
